plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wl.orders'
    compileSdk 34

    defaultConfig {
        applicationId "com.wl.orders"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Release signing. The keystore is NOT stored in the repo: it is read from
    // app/release.keystore (created by CI from GitHub secrets, or placed there by you)
    // and the passwords come from environment variables. See README "Signed release APK".
    def releaseKeystore = file("release.keystore")

    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.android.volley:volley:1.2.1'
}
