name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app   # your Android project lives in this subfolder

    env:
      KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # No gradlew in the repo, so install Gradle directly instead of using the wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ---------- Signed RELEASE build (when the 4 signing secrets exist) ----------
      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: wosux-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk

      # ---------- Fallback: debug build (will show install warnings) ----------
      - name: Warn - no signing key configured
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::No signing secrets found - building a DEBUG apk, which shows install warnings. See README 'Signed release APK'."

      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: wl-orders-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
